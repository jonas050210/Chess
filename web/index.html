<!doctype html>
<html lang="de" data-theme="duo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lokaler Chess Bot v6.2</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#262522; --bg2:#302e2b; --panel:#3a3834; --panel2:#45423d;
  --text:#f4f2ec; --muted:#aaa69b; --line:#56524b;
  --frame:#4e7837; --frame2:#3c5c2a; --accent:#81b64c; --accent-d:#6f9f3e;
  --light:#eeeed2; --dark:#769656; --coord-on-light:#769656; --coord-on-dark:#eeeed2;
  --last:rgba(246,246,105,.48); --sel:rgba(255,255,0,.34);
  --hint:rgba(90,170,255,.45); --mark:rgba(235,60,60,.55);
  --check:rgba(232,83,74,.85); --shadow:0 18px 44px rgba(0,0,0,.42);
}
html[data-theme="brown"]{--bg:#2b2521;--panel:#3d342c;--panel2:#4a3f35;--frame:#8b6343;--frame2:#6d4c33;--accent:#c08b5c;--accent-d:#a67549;--light:#f0d9b5;--dark:#b58863;--coord-on-light:#b58863;--coord-on-dark:#f0d9b5}
html[data-theme="blue"]{--bg:#222831;--panel:#2f3945;--panel2:#3a4654;--frame:#3f6d8e;--frame2:#2f5270;--accent:#6fa8c7;--accent-d:#548fb0;--light:#e8edf2;--dark:#7b9bb8;--coord-on-light:#7b9bb8;--coord-on-dark:#e8edf2}
html[data-theme="midnight"]{--bg:#11161c;--bg2:#182028;--panel:#202a34;--panel2:#2a3642;--line:#3a4856;--text:#eef3f8;--muted:#9fb0c0;--frame:#2c3b4a;--frame2:#1e2a35;--accent:#5f9ea0;--accent-d:#4a8587;--light:#cdd6e0;--dark:#6c8199;--coord-on-light:#6c8199;--coord-on-dark:#cdd6e0}
html[data-theme="sand"]{--bg:#2f2a22;--panel:#40382c;--panel2:#4d4335;--frame:#a07c4f;--frame2:#7d5f3a;--accent:#d2ab70;--accent-d:#b8915a;--light:#f4e3bf;--dark:#c39a68;--coord-on-light:#c39a68;--coord-on-dark:#f4e3bf}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 62%);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.app{max-width:1180px;margin:0 auto;padding:18px 20px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--frame2));
  display:grid;place-items:center;font-size:28px;color:#14210c;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.badge{font-size:11px;color:#e7f5d7;background:rgba(129,182,76,.14);border:1px solid rgba(129,182,76,.4);
  padding:7px 11px;border-radius:999px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(320px,680px) 350px;gap:22px;align-items:start}
.board-column{min-width:0}
.player-bar{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin:8px 0;min-height:54px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:linear-gradient(145deg,var(--panel2),var(--bg2));border:1px solid var(--line);flex:0 0 auto}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pname{font-size:14px;font-weight:650}
.captured{display:flex;gap:1px;flex-wrap:wrap;min-height:18px;align-items:center}
.cap-svg{display:inline-block;width:17px;height:17px;background-size:contain;background-repeat:no-repeat;
  background-position:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));margin-right:-1px}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;background:#1f1e1c;border:1px solid #111;
  padding:7px 11px;border-radius:7px;min-width:78px;text-align:center;color:#ddd}
.clock.active{background:var(--accent);color:#14210c;border-color:var(--accent-d);box-shadow:0 0 0 2px rgba(129,182,76,.25)}
.board-row{display:flex;gap:10px;align-items:stretch}
.evalbar{width:22px;background:#1b1a18;border:1px solid #111;border-radius:6px;position:relative;overflow:hidden;flex:0 0 auto}
.evalfill{position:absolute;left:0;bottom:0;width:100%;height:50%;background:linear-gradient(#fff,#d9d9d0);transition:height .35s ease}
.evalbar span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%) rotate(-90deg);transform-origin:center;
  font-size:9px;color:#111;font-weight:800;white-space:nowrap;pointer-events:none}
.board-wrap{position:relative;flex:1;min-width:0}
.board{width:min(70vmin,640px);max-width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);
  border:10px solid var(--frame);border-radius:6px;
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(0,0,0,.18);overflow:hidden;
  user-select:none;touch-action:none;background:var(--dark)}
.square{position:relative;display:grid;place-items:center;min-width:0}
.square.light{background:var(--light)}
.square.dark{background:var(--dark)}
.overlay{position:absolute;inset:0;z-index:1;pointer-events:none}
.coord{position:absolute;z-index:2;font-size:clamp(8px,1.5vmin,12px);font-weight:800;pointer-events:none;opacity:.95;
  text-shadow:0 1px 0 rgba(0,0,0,.12)}
.coord.file{bottom:2px;right:4px}
.coord.rank{top:2px;left:4px}
.coord.on-light{color:var(--coord-on-light)}
.coord.on-dark{color:var(--coord-on-dark)}
.board.no-coords .coord{display:none}
.piece{position:relative;z-index:2;width:96%;height:96%;cursor:grab;background-size:contain;
  background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 4px 3px rgba(0,0,0,.52));
  transition:transform .10s ease}
.piece:hover{transform:scale(1.04)}
.piece:active{cursor:grabbing}
.dot{position:absolute;z-index:3;width:24%;height:24%;border-radius:50%;background:rgba(20,20,16,.26);pointer-events:none}
.capture-ring{position:absolute;z-index:3;inset:5%;border:clamp(4px,.9vmin,8px) solid rgba(20,20,16,.26);border-radius:50%;pointer-events:none}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);
  width:clamp(34px,7.8vmin,70px);height:clamp(34px,7.8vmin,70px);background-size:contain;
  background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55));opacity:.92}
.anim-piece{position:absolute;z-index:25;pointer-events:none;background-size:contain;background-repeat:no-repeat;
  background-position:center;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.promo{position:absolute;z-index:30;inset:0;background:rgba(15,15,13,.76);display:grid;place-items:center;gap:8px;
  grid-template-columns:repeat(4,minmax(52px,1fr));padding:14px;border-radius:5px}
.promo.hidden,.ghost.hidden,.toast.hidden{display:none}
.promo-btn{background:var(--light);border:2px solid var(--frame);border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;color:#222}
.promo-piece{width:62px!important;height:62px!important;position:relative;z-index:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.promo-btn small{font-size:10px;font-weight:700}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:0 0 11px}
.status-line{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-size:14px}
.status-line .dot{width:11px;height:11px;border-radius:50%;background:#fff;border:1px solid #777;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,input,button{font:inherit}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:13px}
.checks{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0 12px}
.check{flex-direction:row;align-items:center;gap:7px;font-size:12px;color:var(--text)}
.check input{accent-color:var(--accent);width:15px;height:15px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.btnrow4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 8px;
  font-size:12px;font-weight:650;cursor:pointer;transition:.15s ease}
button:hover{border-color:var(--accent);transform:translateY(-1px)}
button.primary{background:linear-gradient(145deg,var(--accent),var(--accent-d));color:#14210c;border-color:transparent}
button.danger{border-color:rgba(232,83,74,.55)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.analysis-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.pulse.on{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.evalbig{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:8px;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:rgba(129,182,76,.16);
  border:1px solid rgba(129,182,76,.4);color:var(--text)}
.tag.muted{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.pv{display:block;white-space:pre-wrap;background:var(--bg2);border-radius:6px;padding:7px;font-size:11px;max-height:54px;overflow:auto}
.movelist{max-height:170px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px}
.moverow{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:4px 6px;font-size:13px;border-radius:5px}
.moverow:nth-child(odd){background:rgba(255,255,255,.025)}
.mn{color:var(--muted)}
.mv{font-variant-numeric:tabular-nums}
.mv.last{background:rgba(129,182,76,.28);border-radius:4px;font-weight:750}
details{margin-top:9px;font-size:12px;color:var(--muted)}
details code,code.fen{display:block;white-space:pre-wrap;word-break:break-word;color:var(--text);background:var(--bg2);
  border-radius:6px;padding:8px;font-size:10.5px;max-height:76px;overflow:auto;margin:0 0 9px}
.kv{display:flex;flex-direction:column;gap:6px;font-size:12px}
.kv>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv>div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:right}
.foot{margin-top:20px;text-align:center;font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;background:#181715;color:#fff;
  border:1px solid var(--accent);padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow)}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{order:2}.board{width:min(88vmin,640px)}}
</style>
<style>
/* Storybook-/Duolingo-inspiriertes Light-Theme. Eigene Tokens, keine fremden Assets. */
html[data-theme="duo"]{
  --bg:#ffffff;--bg2:#f7f7f7;--panel:#ffffff;--panel2:#f7f7f7;
  --text:#4b4b4b;--muted:#777777;--line:#afafaf;
  --frame:#58cc02;--frame2:#58a700;--accent:#58cc02;--accent-d:#58a700;
  --light:#ffffff;--dark:#a5ed6e;--coord-on-light:#58a700;--coord-on-dark:#000437;
  --last:rgba(255,200,0,.42);--sel:rgba(255,200,0,.34);
  --hint:rgba(28,176,246,.34);--mark:rgba(28,176,246,.55);
  --check:rgba(255,75,75,.82);--shadow:none;
  --night:#000437;--story:#d7ffb8;--blue:#1cb0f6;--bee:#ffc800;--cardinal:#ff4b4b;
}
html[data-theme="duo"] body{background:#ffffff;color:#4b4b4b;
  font-family:"Nunito","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif}
html[data-theme="duo"] .app{max-width:1200px}
html[data-theme="duo"] .brand h1{font-size:22px;font-weight:800;color:#58cc02;letter-spacing:-.02em}
html[data-theme="duo"] .brand p{color:#777777;font-size:13px;font-weight:600}
html[data-theme="duo"] .logo{background:#d7ffb8;border:2px solid #000437;border-radius:16px;
  box-shadow:none;width:50px;height:50px}
html[data-theme="duo"] .badge{background:#ffffff;color:#000437;border:2px solid #afafaf;
  border-radius:999px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
html[data-theme="duo"] .player-bar{background:#ffffff;border:2px solid #afafaf;border-radius:16px}
html[data-theme="duo"] .avatar{background:#d7ffb8;border:2px solid #000437;color:#000437;font-weight:800}
html[data-theme="duo"] .cap-svg{filter:none}
html[data-theme="duo"] .clock{background:#ffffff;color:#4b4b4b;border:2px solid #afafaf;
  border-radius:12px;font-weight:800}
html[data-theme="duo"] .clock.active{background:#58cc02;color:#ffffff;border-color:#58a700;box-shadow:none}
html[data-theme="duo"] .evalbar{background:#f7f7f7;border:2px solid #afafaf;border-radius:12px}
html[data-theme="duo"] .evalfill{background:#58cc02;transition:height .25s ease}
html[data-theme="duo"] .board{border:8px solid #58cc02;border-radius:16px;box-shadow:none}
html[data-theme="duo"] .square{box-shadow:inset 0 0 0 1px rgba(0,4,55,.10)}
html[data-theme="duo"] .coord{text-shadow:none;font-weight:800}
html[data-theme="duo"] .piece{filter:none;transition:transform .12s cubic-bezier(.68,-.55,.265,1.55)}
html[data-theme="duo"] .piece:hover{transform:scale(1.06)}
html[data-theme="duo"] .dot{background:rgba(0,4,55,.22)}
html[data-theme="duo"] .capture-ring{border-color:rgba(0,4,55,.30)}
html[data-theme="duo"] .ghost,.anim-piece{filter:none}
html[data-theme="duo"] .promo{background:rgba(255,255,255,.96)}
html[data-theme="duo"] .promo-btn{background:#d7ffb8;border:2px solid #000437;border-radius:12px;color:#000437}
html[data-theme="duo"] .card{background:#ffffff;border:2px solid #afafaf;border-radius:16px;padding:18px;box-shadow:none}
html[data-theme="duo"] .card h2{color:#58cc02;font-weight:800;letter-spacing:.05em;font-size:14px}
html[data-theme="duo"] .status-line{font-weight:700}
html[data-theme="duo"] .status-line .dot{border:2px solid #000437;background:#ffffff}
html[data-theme="duo"] label,.check{color:#777777;font-weight:700}
html[data-theme="duo"] select{background:#ffffff;color:#4b4b4b;border:2px solid #afafaf;border-radius:12px;padding:9px 10px;font-weight:700}
html[data-theme="duo"] .check input{accent-color:#58cc02}
html[data-theme="duo"] button{background:#ffffff;color:#000437;border:2px solid #afafaf;border-radius:12px;
  font-weight:800;text-transform:uppercase;letter-spacing:.53px;padding:11px 9px;box-shadow:none}
html[data-theme="duo"] button:hover{border-color:#1cb0f6;transform:translateY(-1px)}
html[data-theme="duo"] button:active{transform:translateY(2px)}
html[data-theme="duo"] button.primary{background:#58cc02;color:#ffffff;border-color:#58a700;
  border-bottom:4px solid #58a700}
html[data-theme="duo"] button.primary:active{border-bottom-width:0;transform:translateY(4px)}
html[data-theme="duo"] button.danger{border-color:#ff4b4b;color:#ff4b4b}
html[data-theme="duo"] button:disabled{opacity:.55;transform:none}
html[data-theme="duo"] .pulse.on{background:#58cc02}
html[data-theme="duo"] .evalbig{color:#58cc02;font-weight:800}
html[data-theme="duo"] .tag{background:#d7ffb8;border:2px solid #58cc02;color:#000437;font-weight:700;border-radius:999px}
html[data-theme="duo"] .tag.muted{background:#f7f7f7;border-color:#e5e5e5;color:#777777}
html[data-theme="duo"] .pv,.movelist,details code,code.fen{background:#f7f7f7;border:2px solid #e5e5e5;border-radius:12px;color:#4b4b4b}
html[data-theme="duo"] .moverow:nth-child(odd){background:#f7f7f7}
html[data-theme="duo"] .mv.last{background:#58cc02;color:#ffffff;border-radius:8px}
html[data-theme="duo"] .foot{background:#58cc02;color:#ffffff;border:2px solid #58a700;border-radius:16px;
  padding:14px;font-weight:800;letter-spacing:.02em}
html[data-theme="duo"] .toast{background:#000437;color:#ffffff;border:2px solid #58cc02;border-radius:12px;box-shadow:none}
html[data-theme="duo"] .promo-btn small{font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-label="Storybook-Pawn">
        <svg viewBox="0 0 64 64" width="38" height="38" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="#d7ffb8" stroke="#000437" stroke-width="4"/>
          <path d="M20 46 Q32 55 44 46 L45 25 Q32 9 19 25 Z" fill="#58cc02" stroke="#000437" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="26" cy="30" r="3.2" fill="#000437"/>
          <circle cx="38" cy="30" r="3.2" fill="#000437"/>
          <path d="M26 37 Q32 42 38 37" fill="none" stroke="#000437" stroke-width="3" stroke-linecap="round"/>
          <circle cx="20" cy="35" r="2.2" fill="#ff86d0"/>
          <circle cx="44" cy="35" r="2.2" fill="#ff86d0"/>
        </svg>
      </div>
      <div><h1>Lokaler Chess Bot</h1><p>Du bist immer Weiß · Dauer-Analyse · 100 % lokal</p></div>
    </div>
    <span class="badge" id="engineBadge">lädt…</span>
  </header>

  <main class="layout">
    <section class="board-column">
      <div class="player-bar">
        <div class="avatar" id="avatarTop">KI</div>
        <div class="pinfo"><span class="pname" id="nameTop">Lokale KI</span><span class="captured" id="capTop"></span></div>
        <div class="clock" id="clockTop">10:00</div>
      </div>

      <div class="board-row">
        <div class="evalbar"><div class="evalfill" id="evalFill"></div><span id="evalText">0.0</span></div>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Schachbrett"></div>
          <div id="promotion" class="promo hidden"></div>
        </div>
      </div>
      <div id="ghost" class="ghost hidden"></div>

      <div class="player-bar">
        <div class="avatar" id="avatarBottom">DU</div>
        <div class="pinfo"><span class="pname" id="nameBottom">Du</span><span class="captured" id="capBottom"></span></div>
        <div class="clock" id="clockBottom">10:00</div>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <div class="status-line"><span class="dot" id="turnDot"></span><strong id="statusText">lädt…</strong></div>
        <div class="grid2">
          <label>Deine Seite<select id="side"><option value="w">Weiß</option></select></label>
          <label>Level<select id="level"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
          <label>Zeit<select id="time"><option value="180">3 min</option><option value="300">5 min</option><option value="600" selected>10 min</option><option value="900">15 min</option></select></label>
          <label>Theme<select id="theme"><option value="duo" selected>Storybook</option><option value="green">Grün</option><option value="brown">Braun</option><option value="blue">Blau</option><option value="midnight">Mitternacht</option><option value="sand">Sand</option></select></label>
        </div>
        <div class="grid2">
          <label>Highlight<select id="highlight"><option value="yellow">Gelb</option><option value="blue">Blau</option><option value="red">Rot</option></select></label>
          <label>Denkzeit<select id="thinkDelay"><option value="0">Sofort</option><option value="0.6" selected>0,6 s</option><option value="1.5">1,5 s</option><option value="3">3 s</option></select></label>
          <label>Inkrement<select id="increment"><option value="0">0 s</option><option value="2">+2 s</option><option value="5">+5 s</option><option value="10">+10 s</option></select></label>
          <label>Textur<select id="textureStyle"><option value="on">Fein</option><option value="off">Clean</option></select></label>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="botEnabled" checked> Bot</label>
          <label class="check"><input type="checkbox" id="coords" checked> Koordinaten</label>
          <label class="check"><input type="checkbox" id="anim" checked> Animation</label>
          <label class="check"><input type="checkbox" id="autoQueen"> Auto-Dame</label>
          <label class="check"><input type="checkbox" id="premove" checked> Premove</label>
        </div>
        <div class="btnrow">
          <button id="btnNew" class="primary">Neue Partie</button>
          <button id="btnFlip">Drehen</button>
          <button id="btnUndo">Zurück</button>
          <button id="btnHint">Tipp</button>
        </div>
      </div>

      <div class="card">

 "K":"M46 6 L54 6 L54 16 L64 16 L64 24 L54 24 L54 34 L71 42 L76 68 L80 88 Q81 94 74 94 L26 94 Q19 94 20 88 L24 68 L29 42 L46 34 L46 24 L36 24 L36 16 L46 16 Z",

/* ---------------- Storybook-Figuren: flache Sticker-Farben, dicke Outlines ---------------- */
function pieceColor(code){return code===code.toUpperCase()?"w":"b";}
function pieceSVG(code){
  const up=code.toUpperCase(),white=pieceColor(code)==="w";
  const pal=(THEME_PIECE[theme]||THEME_PIECE.duo)[white?"w":"b"];
  const id="pc"+(++svgId);
  const path=PIECE_PATHS[up];
  const accent=pal.accent||pal.inner;
  const c=`fill="${pal.fill}" stroke="${pal.stroke}" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"`;
  let body=`<defs><clipPath id="${id}"><path d="${path}" clip-rule="evenodd"/></clipPath></defs>`;
  body+=`<path d="${path}" fill-rule="evenodd" ${c}/>`;
  body+=`<g clip-path="url(#${id})">`;
  body+=`<path d="${PIECE_SHADE[up]}" fill="${pal.shade}" opacity="${textureOn?(white?0.95:0.78):(white?0.35:0.25)}"/>`;
  body+=`<path d="${path}" fill="none" stroke="${pal.inner}" stroke-width="1.5" opacity=".85" `+
        `transform="translate(50 50) scale(.945) translate(-50 -50)"/>`;
  body+=`</g>`;
  body+=`<path d="${PIECE_MARK[up]}" fill="none" stroke="${accent}" stroke-width="2.6" `+
        `stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
  if(up==="N"){
    body+=`<circle cx="${KNIGHT_EYE[0]}" cy="${KNIGHT_EYE[1]}" r="${KNIGHT_EYE[2]}" `+
          `fill="${accent}" stroke="${pal.stroke}" stroke-width="1"/>`+
          `<path d="${KNIGHT_MOUTH}" fill="none" stroke="${pal.stroke}" stroke-width="2.3" stroke-linecap="round"/>`;
  }else{
    for(const [x,y] of PIECE_FACE.eyes)body+=`<circle cx="${x}" cy="${y}" r="${PIECE_FACE.r}" `+
          `fill="${accent}" stroke="${pal.stroke}" stroke-width=".9"/>`;
    body+=`<path d="${PIECE_FACE.mouth}" fill="none" stroke="${pal.stroke}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  if(textureOn)body+=`<path d="M76 16 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" `+
        `fill="${accent}" stroke="${pal.stroke}" stroke-width=".7" opacity=".9"/>`;

}
function svgURI(code){
  const key=code+"|"+theme+"|"+(textureOn?"t":"f");
  if(!PIECE_URI.has(key))PIECE_URI.set(key,"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(pieceSVG(code)));
  return PIECE_URI.get(key);
}

/* ---------------- Koordinaten / Hilfen ---------------- */
function fenToBoard(fen){
  const out=[];
  for(const row of fen.split(" ")[0].split("/"))for(const ch of row){
    if(/[1-8]/.test(ch)){for(let i=0;i<Number(ch);i++)out.push(null);}else out.push(ch);
  }
  return out;
}
function sqToIndex(sq){const f="abcdefgh".indexOf(sq[0]),rk=Number(sq[1])-1;return (7-rk)*8+f;}
function viewToSquare(r,c){const file=flip?7-c:c,rank=flip?r:7-r;return "abcdefgh"[file]+(rank+1);}
function codeAt(sq){return boardArr[sqToIndex(sq)]||null;}
function legalTargets(from){return (state?.legal||[]).filter(m=>m.slice(0,2)===from).map(m=>m.slice(2,4));}
function canMove(){
  if(!state||busy||offline&&state!==DEMO)return false;
  if(!["playing","check"].includes(state.status))return false;
  if(state.bot_enabled&&state.turn!==state.you_color)return false;
  return true;
}
function fmt(sec){
  sec=Math.max(0,sec||0);const m=Math.floor(sec/60),s=Math.floor(sec%60);
  return sec<20?`${m}:${String(s).padStart(2,"0")}.${Math.floor((sec%1)*10)}`:`${m}:${String(s).padStart(2,"0")}`;
}
function materialEval(fen){
  const v={p:1,n:3,b:3.2,r:5,q:9,k:0};let d=0;
  for(const row of fen.split(" ")[0].split("/"))for(const ch of row)if(/[a-zA-Z]/.test(ch))d+=(ch===ch.toUpperCase()?1:-1)*v[ch.toLowerCase()];
  return d;
}
function CSSVAR(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"rgba(0,0,0,.2)";}
function setPalette(){const p=PALETTES[highlight]||PALETTES.yellow;for(const [k,v] of Object.entries(p))document.documentElement.style.setProperty("--"+k,v);}
function syncSettings(s){
  const st=s.settings||{};
  const before=`${theme}|${textureOn}|${highlight}|${coordsOn}|${animOn}|${autoQueen}|${premoveOn}|${arrowsOn}|${flip}`;
  theme=st.theme||theme;highlight=st.highlight||highlight;
  coordsOn=st.coords??coordsOn;animOn=st.animation??animOn;autoQueen=st.auto_queen??autoQueen;
  textureOn=st.texture??textureOn;premoveOn=st.premove??premoveOn;arrowsOn=st.arrows??arrowsOn;
  flip=st.flip??flip;thinkDelay=s.think_delay??thinkDelay;
  const after=`${theme}|${textureOn}|${highlight}|${coordsOn}|${animOn}|${autoQueen}|${premoveOn}|${arrowsOn}|${flip}`;
  if(before!==after)PIECE_URI.clear();
}

/* ---------------- State & Rendering ---------------- */
function syncClocks(){localClocks={...(state?.clocks||{w:600,b:600})};lastSync=performance.now();}
function applyState(s,animate=true){
  const prevFen=state?.fen,prevSan=state?.san?.length||0,nextSan=s.san?.length||0;
  state=s;syncSettings(s);syncClocks();marked.clear();selected=null;hintTarget=null;drag=null;
  ghost.classList.add("hidden");renderAll();
  if(animate&&s.last_move&&prevFen&&prevFen!==s.fen&&nextSan>=prevSan)animateMove(s.last_move,prevFen);

function playerColors(){return {top:flip?"w":"b",bottom:flip?"b":"w"};}
function nameFor(c){return state.you_color===c?"Du":(state.bot_enabled?"Lokale KI":"Brett 2");}

function renderBoard(){
  if(!state)return;
  boardArr=fenToBoard(state.fen);boardEl.innerHTML="";boardEl.classList.toggle("no-coords",!coordsOn);
  const lf=state.last_move?state.last_move.slice(0,2):null,lt=state.last_move?state.last_move.slice(2,4):null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const sq=viewToSquare(r,c),f="abcdefgh".indexOf(sq[0]),rk=Number(sq[1])-1,isLight=(f+rk)%2===1;
    const el=document.createElement("div");el.className=`square ${isLight?"light":"dark"}`;el.dataset.sq=sq;
    const layers=[];
    if(sq===lf||sq===lt)layers.push(`linear-gradient(${CSSVAR("--last")},${CSSVAR("--last")})`);
    if(sq===selected)layers.push(`linear-gradient(${CSSVAR("--sel")},${CSSVAR("--sel")})`);
    if(sq===hintTarget)layers.push(`linear-gradient(${CSSVAR("--hint")},${CSSVAR("--hint")})`);
    if(state.check_square===sq)layers.push(`radial-gradient(circle, ${CSSVAR("--check")} 0%, rgba(232,83,74,.35) 55%, transparent 72%)`);
    if(marked.has(sq))layers.push(`linear-gradient(${CSSVAR("--mark")},${CSSVAR("--mark")})`);
    const ov=document.createElement("div");ov.className="overlay";ov.style.backgroundImage=layers.join(",");el.appendChild(ov);
    if(rk===0){const s=document.createElement("span");s.className=`coord file ${isLight?"on-light":"on-dark"}`;s.textContent="abcdefgh"[f];el.appendChild(s);}
    if(f===0){const s=document.createElement("span");s.className=`coord rank ${isLight?"on-light":"on-dark"}`;s.textContent=String(rk+1);el.appendChild(s);}
    const code=boardArr[sqToIndex(sq)];

    if(code&&!lifted)el.appendChild(renderPieceEl(code,sq));
    if(selected&&legalTargets(selected).includes(sq)){
      const dest=code,from=codeAt(selected),ep=from&&from.toUpperCase()==="P"&&!dest&&selected[0]!==sq[0];
      const mk=document.createElement("div");mk.className=dest||ep?"capture-ring":"dot";el.appendChild(mk);
    }
    boardEl.appendChild(el);
  }

/* ---------------- Animation ---------------- */
function moveParts(uci){
  const from=uci.slice(0,2),to=uci.slice(2,4),parts=[[from,to]];
  if(from[0]==="e"&&(from[1]==="1"||from[1]==="8")&&(to[0]==="g"||to[0]==="c")){
    const r=from[1];parts.push(to[0]==="g"?[`h${r}`,`f${r}`]:[`a${r}`,`d${r}`]);
  }
  return parts;
}
function animateMove(uci,prevFen){
  if(!animOn||!uci||!prevFen)return;
  const old=fenToBoard(prevFen),parts=moveParts(uci),wrap=boardEl.parentElement;
  if(!wrap||!parts.length)return;
  animHide=new Set(parts.map(p=>p[1]));renderBoard();
  const wr=wrap.getBoundingClientRect();
  let remaining=parts.length;
  const done=()=>{remaining--;if(remaining<=0){animHide=new Set();renderBoard();}};
  for(const [from,to] of parts){
    const code=old[sqToIndex(from)]||codeAt(to);
    const a=boardEl.querySelector(`[data-sq="${from}"]`),b=boardEl.querySelector(`[data-sq="${to}"]`);
    if(!code||!a||!b){done();continue;}
    const r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();
    const el=document.createElement("div");el.className=`anim-piece ${pieceColor(code)==="w"?"white":"black"}`;
    el.style.backgroundImage=pieceBg(code);
    el.style.left=(r1.left-wr.left)+"px";el.style.top=(r1.top-wr.top)+"px";
    el.style.width=r1.width+"px";el.style.height=r1.height+"px";wrap.appendChild(el);
    if(!el.animate){el.remove();done();continue;}
    const an=el.animate([{transform:"translate(0,0)",opacity:1},
      {transform:`translate(${r2.left-r1.left}px,${r2.top-r1.top}px)`,opacity:1}],
      {duration:260,easing:"cubic-bezier(.2,.8,.2,1)"});
    let closed=false;const cleanup=()=>{if(closed)return;closed=true;el.remove();done();};
    an.onfinish=cleanup;an.onerror=cleanup;
  }
}

/* ---------------- Züge / Bot ---------------- */
function showPromotion(color,cb){
  promoEl.innerHTML="";
  for(const [ch,label] of [["q","Dame"],["r","Turm"],["b","Läufer"],["n","Springer"]]){
    const code=color==="w"?ch.toUpperCase():ch.toLowerCase();
    const b=document.createElement("button");b.appendChild(renderPieceEl(code,"","promo-piece"));
    const s=document.createElement("small");s.textContent=label;b.appendChild(s);
    b.onclick=()=>{promoEl.classList.add("hidden");cb(ch);};promoEl.appendChild(b);
  }
  promoEl.classList.remove("hidden");
}
function attemptMove(from,to){
  const cand=(state.legal||[]).filter(m=>m.slice(0,4)===from+to);
  if(!cand.length){toast("Illegaler Zug");return;}
  if(cand.some(m=>m.length===5)&&!autoQueen)showPromotion(state.turn,ch=>postMove(from,to,ch));
  else postMove(from,to,"q");
}
async function waitBot(){
  for(let i=0;i<80;i++){
    await new Promise(r=>setTimeout(r,300));
    if(offline)return;
    const s=await api("/api/state");
    if(!s.bot_thinking){applyState(s);if(s.last_bot_move)toast("KI: "+s.last_bot_move);return;}
    state=s;renderStatus();renderClocks();
  }
}
async function postMove(from,to,promotion){
  if(offline){toast("Vorschau-Modus – starte python3 server.py");selected=null;renderBoard();return;}
  setBusy(true);renderStatus();
  try{
    const s=await api("/api/move",{from,to,promotion});
    applyState(s,true);
    if(s.bot_thinking)await waitBot();
    else if(s.last_bot_move)toast("KI: "+s.last_bot_move);
  }catch(e){toast(e.message);}
  finally{setBusy(false);renderAll();}
}
function currentSettings(){
  return {theme,highlight,coords:coordsOn,animation:animOn,auto_queen:autoQueen,
    premove:premoveOn,arrows:arrowsOn,texture:textureOn,flip};
}
function matchPayload(){
  return {difficulty:Number($("level").value),time_control:Number($("time").value),
    increment:Number($("increment").value),bot_enabled:$("botEnabled").checked,
    think_delay:Number($("thinkDelay").value),settings:currentSettings()};
}
async function newGame(){
  if(offline){toast("Vorschau-Modus – starte python3 server.py");flip=false;renderAll();return;}
  setBusy(true);
  try{
    flip=false;const payload=matchPayload();payload.you_color="w";
    const s=await api("/api/new",payload);applyState(s,false);
    if(s.bot_thinking)await waitBot();
  }catch(e){toast(e.message);}
  finally{setBusy(false);renderAll();}
}
async function sendConfig(){
  if(offline){renderAll();return;}
  setBusy(true);
  try{
    const s=await api("/api/settings",matchPayload());
    applyState(s,false);
    if(s.bot_thinking)await waitBot();
  }catch(e){toast(e.message);}
  finally{setBusy(false);renderAll();}
}
async function undo(){
  if(offline){toast("Vorschau-Modus");return;}
  setBusy(true);try{applyState(await api("/api/undo",{}),false);}catch(e){toast(e.message);}
  finally{setBusy(false);renderAll();}
}
async function hint(){
  if(offline){toast("Vorschau-Modus");return;}
  try{
    const h=await api("/api/hint",{});selected=h.uci.slice(0,2);hintTarget=h.uci.slice(2,4);
    renderBoard();toast("Tipp: "+h.san);
    setTimeout(()=>{selected=null;hintTarget=null;renderBoard();},1900);
  }catch(e){toast(e.message);}
}
async function resignGame(){
  if(offline){toast("Vorschau-Modus");return;}
  try{applyState(await api("/api/resign",{}),false);toast("Aufgegeben");}catch(e){toast(e.message);}
}
async function claimDraw(){
  if(offline){toast("Vorschau-Modus");return;}
  try{applyState(await api("/api/claim_draw",{}),false);toast("Remis beansprucht");}catch(e){toast(e.message);}
}
async function agreeDraw(){
  if(offline){toast("Vorschau-Modus");return;}
  try{applyState(await api("/api/agree_draw",{}),false);toast("Remis vereinbart");}catch(e){toast(e.message);}
}
async function copyFen(){
  try{await navigator.clipboard.writeText(state.fen);toast("FEN kopiert");}
  catch(e){toast("FEN: "+state.fen.slice(0,28)+"…");}
}

/* ---------------- Pointer ---------------- */
function moveGhost(e){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";}
function startDrag(e,pieceEl){
  ghost.className=`ghost ${pieceEl.classList.contains("white")?"white":"black"}`;
  ghost.style.backgroundImage=pieceEl.style.backgroundImage;ghost.classList.remove("hidden");moveGhost(e);
  drag={from:pieceEl.dataset.sq};
}
boardEl.addEventListener("pointerdown",e=>{
  const sqEl=e.target.closest(".square");if(!sqEl)return;const sq=sqEl.dataset.sq;
  if(!canMove()){if(state?.bot_enabled&&state.turn!==state.you_color)toast("KI ist am Zug…");return;}
  if(selected&&legalTargets(selected).includes(sq)){const from=selected;selected=null;attemptMove(from,sq);renderBoard();return;}
  const pieceEl=e.target.closest(".piece"),code=pieceEl?codeAt(sq):null;
  if(pieceEl&&code&&pieceColor(code)===state.turn){selected=sq;startDrag(e,pieceEl);renderBoard();e.preventDefault();}
  else{selected=null;renderBoard();}
});
boardEl.addEventListener("pointermove",e=>{if(drag)moveGhost(e);});
window.addEventListener("pointerup",e=>{
  if(!drag)return;const from=drag.from;drag=null;ghost.classList.add("hidden");
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".square")?.dataset.sq;
  if(target&&target!==from&&legalTargets(from).includes(target)){selected=null;attemptMove(from,target);renderBoard();}
  else if(target===from){selected=from;renderBoard();}
  else{selected=null;renderBoard();}
});
window.addEventListener("pointercancel",()=>{drag=null;ghost.classList.add("hidden");renderBoard();});
boardEl.addEventListener("contextmenu",e=>{
  e.preventDefault();const sq=e.target.closest(".square")?.dataset.sq;if(!sq)return;
  marked.has(sq)?marked.delete(sq):marked.add(sq);renderBoard();
});

/* ---------------- Controls & Timer ---------------- */
$("btnNew").onclick=newGame;
$("btnFlip").onclick=()=>{flip=!flip;renderAll();sendConfig();};
$("btnUndo").onclick=undo;
$("btnHint").onclick=hint;
$("btnResign").onclick=resignGame;
$("btnClaim").onclick=claimDraw;
$("btnAgree").onclick=agreeDraw;
$("btnCopyFen").onclick=copyFen;
for(const id of ["level","time","increment","botEnabled","thinkDelay"])$(id).onchange=sendConfig;
$("theme").onchange=()=>{theme=$("theme").value;renderAll();sendConfig();};
$("highlight").onchange=()=>{highlight=$("highlight").value;renderAll();sendConfig();};
$("coords").onchange=()=>{coordsOn=$("coords").checked;renderAll();sendConfig();};
$("anim").onchange=()=>{animOn=$("anim").checked;sendConfig();};
$("autoQueen").onchange=()=>{autoQueen=$("autoQueen").checked;sendConfig();};
$("textureStyle").onchange=()=>{textureOn=$("textureStyle").value==="on";PIECE_URI.clear();renderAll();sendConfig();};
$("premove").onchange=()=>{premoveOn=$("premove").checked;sendConfig();};

setInterval(()=>{
  if(!state||busy)return;
  const now=performance.now(),dt=(now-lastSync)/1000;lastSync=now;
  if(state.clock_started&&["playing","check"].includes(state.status)){
    localClocks[state.turn]=Math.max(0,(localClocks[state.turn]||0)-dt);renderClocks();
  }
},250);
setInterval(async()=>{
  if(offline||!state||analysisBusy)return;
  analysisBusy=true;
  try{renderAnalysis(await api("/api/analysis"));}catch(e){}
  finally{analysisBusy=false;}
},800);

/* ---------------- Boot: sauber, Weiß, kein Sofortzug ---------------- */
(async function boot(){
  theme=$("theme").value;highlight=$("highlight").value;coordsOn=$("coords").checked;
  animOn=$("anim").checked;autoQueen=$("autoQueen").checked;thinkDelay=Number($("thinkDelay").value);
  textureOn=$("textureStyle").value==="on";premoveOn=$("premove").checked;arrowsOn=true;
  try{
    applyState(await api("/api/state"),false);
    renderAnalysis({finished:false,thinking:true,result:null,depth:0});
  }catch(e){
    offline=true;state=DEMO;syncClocks();renderAll();
    renderAnalysis({finished:false,thinking:false,result:null,depth:0});
    toast("Vorschau-Modus: starte python3 server.py für die KI");
  }
})();
</script>
